[workspace]
resolver = "2"
members = [
    "crates/orbit-pi",
    "crates/orbit-rpc",
]
exclude = ["third_party/gpui-pre", "third_party/gpui-pre-windows"]

# The gpui-pre family is pinned to `=0.3.3` on purpose. 0.3.14 deleted the
# ClearType/subpixel rasterizer that 0.3.3 still carries, so a routine
# `cargo update` would silently return Windows text to grayscale. A bump is a
# migration project (see third_party/gpui-pre/UPSTREAM.md), never an update.
# Only the two crates that need local patches are vendored; the rest of the
# family (platform, macOS, Windows, Linux backends) comes from crates.io.
[patch.crates-io]
gpui-pre = { path = "third_party/gpui-pre" }
gpui-pre-windows = { path = "third_party/gpui-pre-windows" }

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/imrj05/orbit"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Faster debug builds at the expense of runtime performance — fine for a
# rendering spike. Drop this when measuring real-world perf.
[profile.dev]
opt-level = 1
# Incremental codegen for this crate has emitted object files whose internal
# LLVM symbols no longer match its dependencies' rlibs, failing the final link
# with `ld: symbol(s) not found for architecture arm64`. Build non-incrementally
# so `cargo build`/`bacon` links reliably; a from-scratch app rebuild is ~25s.
incremental = false
