name: CI

on:
  push:
    branches: [main, "redesign/**"]
  pull_request:

permissions:
  contents: read

# GPUI renders through each platform's native graphics API (Metal on macOS,
# DXGI on Windows, X11/Wayland on Linux), so every change is built on all three
# shipped platforms. Linux needs the same system libraries the release bundle
# installs (`scripts/bundle-linux.sh`).
#
# The "Protect Main Branch" ruleset requires one status check named `build`.
# The matrix legs report `build (<os>)`, so the `build` fan-in job below is
# what reports the required context — and it succeeds only when every
# platform leg did.
jobs:
  check:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang cmake pkg-config \
            libfontconfig-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxi-dev libxtst-dev \
            libxkbcommon-x11-dev libssl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Zero warnings from `cargo build` is a stated project invariant
      # (AGENT.md → Verification). Tests are no longer run in CI; run them
      # locally with `cargo test --workspace`.
      - name: Build
        run: cargo build --workspace

      # Informational: the repo carries pre-existing clippy lints, so this
      # step reports rather than gates. One all-targets pass is enough — the
      # per-platform builds above are the check that the app ships everywhere.
      - name: Clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets

  # The required `build` status check. `always()` keeps this context
  # reporting even when a matrix leg fails or the matrix is cancelled, so
  # branch protection can never hang on "Expected — Waiting for status to be
  # reported"; the first step then turns a non-success into a red `build`.
  build:
    name: build
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform build
        if: needs.check.result != 'success'
        run: |
          echo "::error::the platform build matrix did not pass: ${{ needs.check.result }}"
          exit 1

      - name: All platforms built
        run: echo "macOS, Linux, and Windows builds passed"
