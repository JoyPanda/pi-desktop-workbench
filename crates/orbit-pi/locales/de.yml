worktree.howto.intro: "Ein Worktree ist eine zweite Auscheckung dieses Repositorys auf einem eigenen Branch. Er teilt sich eine Git-Historie, sodass du mehrere pi-Sitzungen parallel ausführen kannst, ohne zu stashen oder den Branch zu wechseln."
worktree.howto.create: "Erstelle einen mit Worktree: Benenne den Ordner, wähle einen Branch und lege fest, wo er liegt."
worktree.howto.open: "Öffne eine Zeile, um dort zu arbeiten. Explorer, Dateien, Terminal, Git, Review und der Agent folgen alle diesem Ordner."
worktree.howto.setup: "Optional: Füge .orbit/worktree-setup.sh hinzu, um nach dem Erstellen eigene Schritte auszuführen, zum Beispiel .env verlinken oder node_modules teilen."
worktree.howto.rename: "Umbenennen verschiebt nur den Ordner; der Git-Branch behält immer seinen Namen."
