worktree.howto.intro: "워크트리는 이 저장소를 자체 브랜치로 두 번째 체크아웃한 것입니다. 하나의 Git 기록을 공유하므로 스태시하거나 브랜치를 전환하지 않고도 여러 pi 세션을 나란히 실행할 수 있습니다."
worktree.howto.create: "워크트리로 만드세요. 폴더 이름을 정하고, 브랜치를 고르고, 위치를 선택합니다."
worktree.howto.open: "행을 열면 그곳에서 작업합니다. 탐색기, 파일, 터미널, Git, 리뷰, 에이전트가 모두 해당 폴더를 따릅니다."
worktree.howto.setup: "선택 사항: 생성 후 직접 단계를 실행하려면 .orbit/worktree-setup.sh를 추가하세요(예: .env 연결, node_modules 공유)."
